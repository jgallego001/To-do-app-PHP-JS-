<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App - Login</title>
    <script defer src="register.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Tahoma, Verdana, sans-serif;
        background: #c0c0c0;
        color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
      }

      main {
        display: flex;
        flex-flow: column;
        justify-content: space-between;
        width: 600px;
        gap: 40px;
        border: 2px outset white;
        background: #d4d0c8;
        box-shadow: 5px 5px 0 #7a7a7a;
        padding: 40px;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
      }

      input {
        width: 250px;
        height: 30px;
        padding: 0 10px;
      }

      .user-form {
        display: flex;
        flex-flow: column;
        align-items: center;
        gap: 10px;
      }

      .input-container > * {
        display: block;
      }
      .hidden {
        display: none;
      }

      .pswrd {
        position: relative;
      }

      button.toggle-show-pswrd {
        display: flex;
        align-items: center;
        position: absolute;
        top: 0;
        right: 5px;
        background-color: #00000000;
        border: none;
        width: fit-content;
        height: 30px;
        cursor: pointer;
      }

      .toggle-show-pswrd img {
        height: 20px;
      }

      button {
        width: 150px;
        height: 40px;
      }

      .login-link {
        text-align: center;
      }

      #resend-code-link {
        cursor: pointer;
      }

      #resend-code-link:link {
        color: blue;
      }
      #resend-code-link:visited {
        color: purple;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="register">
        <h1>Regístrate</h1>

        <form id="email-form" class="user-form">
          <div class="input-container">
            <label for="register-email">Correo</label>
            <input
              type="email"
              name="email"
              id="email-input"
              placeholder="yourname@example.com"
            />
          </div>

          <button type="submit">Siguiente</button>
        </form>

        <form id="verif-code-form" class="user-form ">
          <div class="input-container">
            <label for="verify-code-input">Código de verificación</label>
            <input type="text" name="verif-code" id="verif-code-input" />
          </div>

          <button type="submit">Verificar email</button>

          <a href="#" class="hidden" id="resend-link">Reenviar código</a>
          <span id="resend-code-countdown"></span>
        </form>

        <form id="user-data-form" class="user-form hidden">
          <div class="input-container">
            <label for="verify-code">Nombre</label>
            <input type="text" name="name" id="name-input" />
          </div>

          <div class="input-container">
            <label for="password-input">Contraseña</label>
            <div class="pswrd">
              <input type="password" name="pswrd" id="pswrd-input" />
              <button type="button" class="toggle-show-pswrd">
                <img src="assets/show.png" alt="open eye"/>
              </button>
            </div>
          </div>

          <div class="input-container">
            <label for="confirm-password-input">Confirmar contraseña</label>
            <div class="pswrd">
              <input
                type="password"
                name="confirm-pswrd"
                id="confirm-pswrd-input"
              />
              <button type="button" class="toggle-show-pswrd">
                <img src="assets/show.png" alt="open eye" />
              </button>
            </div>
          </div>

          <button type="submit">Verificar email</button>
        </form>
      </section>
      <div class="login-link">
        <p>¿Ya tienes una cuenta?</p>
        <a href="login.html">Inicia sesión</a>
      </div>
    </main>
  </body>
</html>
