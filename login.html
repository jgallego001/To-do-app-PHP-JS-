<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App - Login</title>
    <script defer src="assets/js/login.js"></script>
    <link rel="stylesheet" href="assets/css/login.css">
  </head>
  <body>
    <div class="alert-container" id="alert-error">
      <img src="assets/images/close.png" alt="cross icon">
      <div class="alert-text">
        <h4>Error</h4>
        <p>Usuario o contraseña incorrectos.</p>
      </div>
    </div>
    <main>
      <h1>Inicia sesión</h1>
      <form id="login-form">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" name="email" />

        <label for="login-psswrd">Contraseña</label>
        <div class="pswrd">
          <input type="password" id="login-psswrd" name="pswrd" />
          <button type="button" id="show-pswrd-btn"><img src="assets/images/show.png" alt="" id="show-pswrd-img"/></button>
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>
      <div class="register-link">
        <p>¿Aún no tienes una cuenta?</p>
        <a href="register.html">Registrate</a>
      </div>
    </main>
  </body>
</html>
