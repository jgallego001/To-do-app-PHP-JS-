<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App - Login</title>
    <script defer src="login.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Tahoma, Verdana, sans-serif;
        background: #c0c0c0;
        color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      main {
        width: 600px;
        height: 500px;
        border: 2px outset white;
        background: #d4d0c8;
        box-shadow: 5px 5px 0 #7a7a7a;
        padding: 40px;
        margin-top: 40px;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
      }

      #login-form {
        display: flex;
        height: 200px;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      #login-form input{
        padding: 0 10px;
      }

      #login-form input,
      #login-form > button {
        width: 300px;
        height: 40px;
      }

      #login-form > button {
        width: 150px;
      }

      .register-link {
        margin-top: 40px;
        text-align: center;
      }
      .pswrd{
        position: relative;
        display: flex;
        align-items: center;
      }
      #login-form input#login-psswrd{
        padding: 0 35px 0 10px;
      }
      #show-pswrd-btn{
        display: flex;
        align-items: center;
        position: absolute;
        background-color: #00000000;
        border: none;
        width: fit-content;
        right: 10px;
        cursor: pointer;
      }
      #show-pswrd-img{
        height: 20px;
      }

      .alert-container {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 400px;
        height: 80px;
        padding: 10px;
        background-color: #ff6161;
        border: 2px solid #9e3232;
        right: 20%;
        top: -80px;
        transition: transform 0.5s ease;
      }
      .alert-container img{
        height: 80%;
      }
      .alert-text{
        color: white;
      }
      .alert-container.active{
        transform: translateY(80px);
      }
    </style>
  </head>
  <body>
    <div class="alert-container" id="alert-error">
      <img src="assets/close.png" alt="cross icon">
      <div class="alert-text">
        <h4>Error</h4>
        <p>Usuario o contraseña incorrectos.</p>
      </div>
    </div>
    <main>
      <h1>Inicia sesión</h1>
      <form id="login-form">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" name="email" />

        <label for="login-psswrd">Contraseña</label>
        <div class="pswrd">
          <input type="password" id="login-psswrd" name="pswrd" />
          <button type="button" id="show-pswrd-btn"><img src="assets/show.png" alt="" id="show-pswrd-img"/></button>
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>
      <div class="register-link">
        <p>¿Aún no tienes una cuenta?</p>
        <a href="register.html">Registrate</a>
      </div>
    </main>
  </body>
</html>
