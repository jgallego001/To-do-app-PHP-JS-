<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App - Login</title>
    <script defer src="login.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Tahoma, Verdana, sans-serif;
        background: #c0c0c0;
        color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
      }

      main {
        width: 600px;
        height: 500px;
        border: 2px outset white;
        background: #d4d0c8;
        box-shadow: 5px 5px 0 #7a7a7a;
        padding: 40px;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
      }

      #login-form {
        display: flex;
        height: 200px;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      #login-form input,
      #login-form button {
        width: 300px;
        height: 40px;
      }

      #login-form button {
        width: 150px;
      }

      .register-link {
        margin-top: 40px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Inicia sesión</h1>
      <form id="login-form">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" name="email" />

        <label for="login-psswrd">Contraseña</label>
        <input type="password" id="login-psswrd" name="pswrd" />

        <button type="submit">Iniciar sesión</button>
      </form>
      <div class="register-link">
        <p>¿Aún no tienes una cuenta?</p>
        <a href="register.html">Registrate</a>
      </div>
    </main>
  </body>
</html>
